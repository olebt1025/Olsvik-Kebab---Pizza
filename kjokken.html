<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kjøkkenskjerm - Olsvik Kebab & Pizza</title>
    <link rel="stylesheet" href="./css/kjokken.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="kjokken-body auth-pending">

    <header class="kjokken-header">
        <h1>Kjøkkenskjerm (Ordre)</h1>
        <nav>
            <a href="admin.html" class="nav-lenke">Gå til Admin</a>
            <a href="index.html" target="_blank" class="nav-lenke">Åpne Kundeside ↗</a>
            <button id="loggut-btn" style="margin-left: 15px;">Logg ut</button>
        </nav>
    </header>

    <main id="kjokken-container">
        <section class="ordre-kolonne" id="kolonne-ny">
            <h2>Nye bestillinger</h2>
            <div class="ordre-liste" id="liste-ny">
                <p>Laster bestillinger...</p>
            </div>
        </section>

        <section class="ordre-kolonne" id="kolonne-lager">
            <h2>Under tilberedning</h2>
            <div class="ordre-liste" id="liste-lager"></div>
        </section>

        <section class="ordre-kolonne" id="kolonne-klar">
            <h2>Klar</h2>
            <div class="ordre-liste" id="liste-klar"></div>
        </section>

        <section class="ordre-kolonne" id="kolonne-utkjoring">
            <h2>Under utkjøring</h2>
            <div class="ordre-liste" id="liste-utkjoring"></div>
        </section>
    </main>

    <script type="module" src="js/firebase-config.js"></script>
    <script type="module" src="js/kjokken.js"></script>
</body>
</html>
