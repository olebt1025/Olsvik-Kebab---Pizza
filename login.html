<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Innlogging - Olsvik Kebab & Pizza</title>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="login-body">

    <main class="login-container">
        <h2>Ansattinnlogging</h2>
        <p>Logg inn for å få tilgang til Kjøkkenskjerm eller Admin.</p>

        <form id="login-form">
            <div class="skjema-gruppe">
                <label for="epost">E-postadresse:</label>
                <input type="email" id="epost" placeholder="f.eks. ansatt@olsvik.no" required>
            </div>

            <div class="skjema-gruppe">
                <label for="passord">Passord:</label>
                <input type="password" id="passord" required>
            </div>

            <p id="feil-melding"></p>

            <button type="submit" id="login-btn">Logg inn</button>
        </form>

        <hr>

        <a href="index.html" class="tilbake-btn">&larr; Tilbake til kundesiden / Meny</a>
    </main>

    <script type="module" src="js/firebase-config.js"></script>
    <script type="module" src="js/login.js"></script>
</body>
</html>
