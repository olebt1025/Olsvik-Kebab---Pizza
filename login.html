<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Innlogging - Olsvik Kebab & Pizza</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body class="login-body">

    <main class="login-container">
        <h2>Ansattinnlogging</h2>
        <p>Logg inn for å få tilgang til Kjøkkenskjerm eller Admin.</p>

        <form id="login-form">
            <div class="skjema-gruppe">
                <label for="epost">E-postadresse:</label>
                <input type="email" id="epost" placeholder="f.eks. ansatt@olsvik.no" required>
            </div>

            <div class="skjema-gruppe">
                <label for="passord">Passord:</label>
                <input type="password" id="passord" required>
            </div>

            <p id="feil-melding" style="color: #ff4d4d; display: none;"></p>

            <button type="submit" id="login-btn">Logg inn</button>
        </form>

        <hr style="margin: 20px 0; border: 0; border-top: 1px solid #444;">

        <a href="index.html" class="tilbake-btn">&larr; Tilbake til kundesiden / Meny</a>
    </main>

    <script type="module" src="js/firebase-config.js"></script>
    <script type="module" src="js/login.js"></script>
</body>
</html>
